name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  TERRAFORM_VERSION: "1.9.8"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - run: terraform fmt -check -recursive -diff

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: terraform validate (every module and example)
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r dir; do
            echo "::group::validate ${dir}"
            terraform -chdir="${dir}" init -backend=false -input=false -no-color
            terraform -chdir="${dir}" validate -no-color
            echo "::endgroup::"
          done < <(find modules -name '*.tf' -not -path '*/.terraform/*' -printf '%h\n' | sort -u)

  tflint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest
      - run: tflint --init
      - run: tflint --recursive --no-color

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: terraform test (every module with a tests/ dir)
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r testdir; do
            module_dir="$(dirname "${testdir}")"
            echo "::group::terraform test ${module_dir}"
            terraform -chdir="${module_dir}" init -backend=false -input=false -no-color
            terraform -chdir="${module_dir}" test -no-color
            echo "::endgroup::"
          done < <(find modules -type d -name tests | sort)

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Add each new module dir here (comma-separated) as it is created.
      - uses: terraform-docs/gh-actions@v1
        with:
          working-dir: modules/naming
          output-file: README.md
          output-method: inject
          fail-on-diff: true

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: trivy config scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          exit-code: "1"
          severity: CRITICAL,HIGH

  terratest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: go test
        working-directory: test
        run: |
          go mod tidy
          go test -v -timeout 30m ./...
