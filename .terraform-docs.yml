formatter: "markdown table"

sort:
  enabled: true
  by: name

settings:
  anchor: true
  color: false
  default: true
  description: true
  escape: false
  hide-empty: false
  html: true
  indent: 2
  # false: always show the required_providers constraint, never the resolved
  # version from .terraform.lock.hcl. Keeps output identical whether or not
  # `terraform init` has been run (CI docs job does not init).
  lockfile: false
  read-comments: true
  required: true
  sensitive: true
  type: true

output:
  file: README.md
  mode: inject
